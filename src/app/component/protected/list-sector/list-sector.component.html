<div class="bg-white rounded-xl shadow-sm p-6">
  <div class="flex ">
    <h2 class="text-xl font-semibold text-gray-800 mb-4">Lista de Setores</h2>
    <h2 class="pt-1 ml-3 cursor-pointer" (click)="fetchSector(true)">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" class="size-5">
        <path fill-rule="evenodd"
              d="M15.312 11.424a5.5 5.5 0 0 1-9.201 2.466l-.312-.311h2.433a.75.75 0 0 0 0-1.5H3.989a.75.75 0 0 0-.75.75v4.242a.75.75 0 0 0 1.5 0v-2.43l.31.31a7 7 0 0 0 11.712-3.138.75.75 0 0 0-1.449-.39Zm1.23-3.723a.75.75 0 0 0 .219-.53V2.929a.75.75 0 0 0-1.5 0V5.36l-.31-.31A7 7 0 0 0 3.239 8.188a.75.75 0 1 0 1.448.389A5.5 5.5 0 0 1 13.89 6.11l.311.31h-2.432a.75.75 0 0 0 0 1.5h4.243a.75.75 0 0 0 .53-.219Z"
              clip-rule="evenodd"/>
      </svg>
    </h2>
  </div>
  <p class="text-gray-600">
    <app-dynamic-table
      [columns]="arrColumns"
      [data]="arrSector"
      [pageSizeOptions]="[10]"
    >
    </app-dynamic-table>
  </p>
  <div class="flex justify-center ">
    <button class="bg-amber-500 shadow-lg hover:shadow-xl text-white px-4 py-2 rounded-md mt-4">
      Adicionar Novo Setor
    </button>
  </div>
</div>

<app-spinner [isLoading]="isLoading"></app-spinner>
